services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      MODE: ws
      NAPCAT_UID: 1000
      NAPCAT_GID: 1000
    ports:
      - "6099:6099"
    volumes:
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/qq:/app/.config/QQ

  yanqi:
    build: .
    restart: unless-stopped
    depends_on:
      - napcat
    ports:
      - "3210:3000"
    volumes:
      - ./data:/app/data
